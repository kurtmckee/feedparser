ci:
  autoupdate_schedule: "monthly"

default_language_version:
  python: "python3.13"

repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"
      - id: "end-of-file-fixer"
        exclude: "\\.xml"
      - id: "mixed-line-ending"
        exclude: "\\.xml"
        args:
          - "--fix=lf"
      - id: "trailing-whitespace"
        exclude: "\\.xml"

  - repo: "https://github.com/asottile/pyupgrade"
    rev: "f22ea0651f4355c655cc581f67813c991c74a312"  # frozen: v3.22.0
    hooks:
      - id: "pyupgrade"
        name: "Enforce Python 3.10+ idioms"
        args:
          - "--py310-plus"

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "a5439e9af2ff9371297bb1a76a01b8ad17989b88"  # frozen: 26.10.1
    hooks:
      - id: "black"

  - repo: "https://github.com/pycqa/isort"
    rev: "5d9c96196def28a1819b6a755a669ec0a3add6aa"  # frozen: 10.0.0b2
    hooks:
      - id: "isort"

  - repo: "https://github.com/pycqa/flake8"
    rev: "960c1d286190804104f7255b97da034446fdaac3"  # frozen: 7.5.0
    hooks:
      - id: "flake8"
        additional_dependencies:
          - "flake8-toml-config==1.0.0"
          - "flake8-bugbear==25.11.29"

  - repo: "https://github.com/editorconfig-checker/editorconfig-checker"
    rev: "0adfdb012938ada0cf563a40f2fceaf9466290ca"  # frozen: v4.0.2
    hooks:
      - id: "editorconfig-checker"

  - repo: "https://github.com/python-jsonschema/check-jsonschema"
    rev: "39478bf2c099a58683d3f1aedf675105318b078d"  # frozen: 0.39.0
    hooks:
      - id: "check-dependabot"
      - id: "check-github-workflows"
      - id: "check-readthedocs"

  - repo: "https://github.com/rhysd/actionlint"
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
    hooks:
      - id: "actionlint"
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570"

  - repo: "https://github.com/kurtmckee/pre-commit-hooks"
    rev: "e7a0fdfcf7fd4c549a32da19187adf3a0b279d4d"  # frozen: v1.0.0
    hooks:
      - id: "verify-consistent-pyproject-toml-python-requirements"
